name: libipcon CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  code-style:
    name: Code Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: |
          failed=0
          for f in $(find . -name "*.c" -o -name "*.h" \
            -not -path "./.git/*" -not -path "./test/mocklib/*" -not -path "./samples/jsutils/*"); do
            if ! clang-format --dry-run --Werror "$f" 2>/dev/null; then
              echo "❌ $f is misformatted"
              failed=$((failed+1))
            fi
          done
          if [ "$failed" -eq 0 ]; then
            echo "✅ All files clean"
          else
            echo "❌ $failed files need formatting fixes"
            echo "Run: find . -name '*.c' -o -name '*.h' | xargs clang-format -i"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libnl-genl-3-dev pkg-config

      - name: Build library
        run: |
          mkdir build && cd build
          cmake -DUNIT_TEST=OFF -DCMAKE_VERBOSE_MAKEFILE=1 ..
          make -j$(nproc)

  test:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnl-genl-3-dev \
            libcmocka-dev \
            lcov \
            pkg-config

      - name: Build with tests
        run: |
          mkdir build && cd build
          cmake -DCMAKE_C_COMPILER=gcc \
                -DUNIT_TEST=ON \
                -DENABLE_NL_MOCK=ON \
                -DENABLE_COVERAGE=ON \
                -DCMAKE_VERBOSE_MAKEFILE=1 ..
          make -j$(nproc)

      - name: Run tests
        run: |
          cd build
          ./test/ut_ipcon

      - name: Generate coverage
        run: |
          cd build
          mkdir -p coverage

          lcov --capture \
            --directory lib/CMakeFiles/ipcon.dir/ \
            --output-file coverage.info \
            --rc lcov_branch_coverage=1

          lcov --remove coverage.info '/usr/include/*' \
            -o coverage.info \
            --rc lcov_branch_coverage=1

          echo "## Coverage Summary" > ${{ github.workspace }}/coverage.md
          echo '```' >> ${{ github.workspace }}/coverage.md
          lcov -l coverage.info --rc lcov_branch_coverage=1 \
            | tail -n +2 >> ${{ github.workspace }}/coverage.md
          echo '```' >> ${{ github.workspace }}/coverage.md

          genhtml coverage.info \
            --output-directory coverage \
            --rc genhtml_branch_coverage=1

      - name: Post coverage to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = fs.readFileSync('${{ github.workspace }}/coverage.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: coverage
            });

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/coverage/
          overwrite: true
